# PlateShare Mutations

mutation CreateDonor($name: String!, $phone: String!, $address: String!, $email: String)
@auth(level: USER) {
  donor_upsert(data: { id_expr: "auth.uid", name: $name, phone: $phone, address: $address, email: $email })
}

mutation CreateDonation($name: String!, $phone: String!, $address: String!, $source: String!, $quantity: String!, $ngo: String!, $imageUrls: [String!]!)
@auth(level: USER) {
  donation_insert(data: {
    name: $name,
    phone: $phone,
    address: $address,
    source: $source,
    quantity: $quantity,
    ngo: $ngo,
    imageUrls: $imageUrls,
    donorId_expr: "auth.uid"
  })
}

mutation CreateRecipient($name: String!, $phone: String!, $address: String!, $email: String)
@auth(level: USER) {
  recipient_upsert(data: { id_expr: "auth.uid", name: $name, phone: $phone, address: $address, email: $email })
}

mutation CreateFoodRequest($donationId: UUID!)
@auth(level: USER) {
  foodRequest_insert(data: {
    donationId: $donationId,
    recipientId_expr: "auth.uid"
  })
}

mutation UpdateDonationStatus($id: UUID!, $status: String!)
@auth(level: USER) {
  donation_upsert(data: { id: $id, status: $status })
}

mutation UpdateRequestStatus($id: UUID!, $status: String!)
@auth(level: USER) {
  foodRequest_upsert(data: { id: $id, status: $status })
}
