# Search for movies, actors, and reviews
query SearchMovie($titleInput: String, $genre: String) @auth(level: PUBLIC, insecureReason: "Anyone can search for movies.") {
  movies(
    where: {
      _and: [{ genre: { eq: $genre } }, { title: { contains: $titleInput } }]
    }
  ) {
    id
    title
    genre
    imageUrl
  }
}
